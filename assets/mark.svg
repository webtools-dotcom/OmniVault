<svg xmlns="http://www.w3.org/2000/svg" viewBox="96 96 320 320">
  <defs>
    <linearGradient id="hv-top-transparent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#B2B5C4"/>
    </linearGradient>
    <linearGradient id="hv-left-transparent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#9699AA"/>
    </linearGradient>
    <linearGradient id="hv-right-transparent" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C8CAD6"/>
      <stop offset="100%" stop-color="#4E5160"/>
    </linearGradient>
    <radialGradient id="hv-ambient-transparent" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="rgba(121, 194, 164, 0.08)"/>
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)"/>
    </radialGradient>
    <filter id="hv-shadow-transparent" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <g  transform="translate(256, 252)">
    <!-- 1. Top Structural Lintel (Omni Containment Lintel) -->
    <path d="M -136 -74
             L -62 -136
             A 26 26 0 0 1 -46 -144
             L 46 -144
             A 26 26 0 0 1 62 -136
             L 136 -74
             L 86 -34
             L 36 -74
             L -36 -74
             L -86 -34
             Z"
          fill="url(#hv-top-transparent)"/>

    <!-- 2. Left Vault Arm (Descending V Wing) -->
    <path d="M -146 -54
             A 16 16 0 0 0 -150 -44
             L -150 44
             A 18 18 0 0 0 -141 60
             L -18 144
             A 24 24 0 0 0 -6 148
             L -6 76
             L -86 24
             L -86 -24
             Z"
          fill="url(#hv-left-transparent)"/>

    <!-- 3. Right Vault Arm (Descending V Wing, Metallic Shadow) -->
    <path d="M 146 -54
             A 16 16 0 0 1 150 -44
             L 150 44
             A 18 18 0 0 1 141 60
             L 18 144
             A 24 24 0 0 1 6 148
             L 6 76
             L 86 24
             L 86 -24
             Z"
          fill="url(#hv-right-transparent)"/>

    <!-- 4. Floating Vault Keystone Core -->
    <polygon points="0,-42 34,8 0,40 -34,8" fill="#FFFFFF"/>
    <polygon points="0,-28 20,8 0,28 -20,8" fill="#12131A"/>

    <!-- 5. Emerald P2P Mesh Beacon -->
    <circle cx="0" cy="8" r="4.5" fill="#79C2A4"/>
    <circle cx="0" cy="8" r="10" fill="none" stroke="#79C2A4" stroke-width="1.5" opacity="0.35"/>
  </g>
</svg>
