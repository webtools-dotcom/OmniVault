<!doctype html>
<html lang="en" style="background-color: #0d0e11; color: #e9eaef">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0D0E11" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OmniVault" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <title>OmniVault</title>
  </head>
  <body
    style="background-color: #0d0e11; color: #e9eaef; margin: 0; overflow: hidden"
    class="bg-[#0D0E11] text-[#E9EAEF] antialiased select-none font-sans"
  >
    <div id="root">
      <div
        style="
          display: flex;
          height: 100vh;
          width: 100vw;
          background: #0d0e11;
          color: #e9eaef;
          font-family: &quot;Archivo&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif;
        "
      >
        <div
          style="
            width: 240px;
            height: 100%;
            border-right: 1px solid rgba(233, 234, 239, 0.06);
            background: #101116;
            padding: 12px;
            box-sizing: border-box;
          "
        >
          <div
            style="
              display: flex;
              align-items: center;
              gap: 8px;
              padding-bottom: 12px;
              border-bottom: 1px solid rgba(233, 234, 239, 0.06);
            "
          >
            <div style="width: 18px; height: 18px; border-radius: 4px; background: #e9eaef"></div>
            <span style="font-size: 12px; font-weight: 700; letter-spacing: -0.02em"
              >OmniVault</span
            >
          </div>
        </div>
        <div style="flex: 1; display: flex; flex-direction: column">
          <div
            style="
              height: 44px;
              border-bottom: 1px solid rgba(233, 234, 239, 0.06);
              background: #101116;
              display: flex;
              align-items: center;
              padding: 0 16px;
            "
          >
            <span style="font-size: 11px; color: #6e7280">vault://loading...</span>
          </div>
          <div style="flex: 1; background: #0d0e11"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
